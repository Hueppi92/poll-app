<section class="survey-list">
	<div class="survey-list__header">
		<button class="survey-list__filter--active" type="button">Active survey</button>
		<button class="survey-list__filter--inactive" type="button">Past survey</button>

		
	</div>

	<div class="survey-list__content">
		@for (survey of surveys(); track survey.id) {
			<app-survey-snippet class="all-surveys-snippet" [survey]="survey" />
		} @empty {
			<p>No active surveys are available.</p>
		}
	</div>
</section>
