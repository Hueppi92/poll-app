<section class="survey-list">
	<div class="survey-list__header">
		<button class="survey-list__filter--active" type="button">Active survey</button>
		<button class="survey-list__filter--inactive" type="button">Past survey</button>
		<label class="survey-list__category-filter">
			<span>sort by</span>
			<select [value]="selectedCategory()" (change)="onCategoryChange($event)">
				<option value="all">All categories</option>
				@for (category of categories(); track category) {
					<option [value]="category">{{ category }}</option>
				}
			</select>
		</label>
	</div>
	
	<div
		class="survey-list__content"
		[class.survey-list__content--empty]="filteredSurveys().length === 0"
	>
			@for (survey of filteredSurveys(); track survey.id) {
				<app-survey-snippet class="all-surveys-snippet" [survey]="survey" />
			} @empty {
				<p>No active surveys are available.</p>
			}
	</div>
</section>
