<article class="preview-card">
  <div class="preview-card-header">
    <p class="preview-card-category">{{ preview().category }}</p>
    @if (preview().description) {
      <h2 class="preview-card-description">{{ preview().description }}</h2>
    
    }
  </div>
  <div class="preview-card-footer">
    <p>{{ remainingDaysLabel() }}</p>
  </div>
</article>
