<article class="survey-snippet" [class.ending-soon]="variant() === 'ending-soon'">
  <p class="categoryBatch">{{ survey().category }}</p>
  <h2 class="description">{{ survey().title }}</h2>

  @if (variant() === 'ending-soon') {
    <p class="endingInDays">
      Ends in {{ remainingDays() }}
      {{ remainingDays() === 1 ? 'day' : 'days' }}
    </p>
  }
</article>
